name: Update NSE breadth dashboard

on:
  schedule:
    # 14:30 UTC = 20:00 IST, Mon–Fri. NSE usually has the bhavcopy up by 19:30 IST.
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}   # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached NSE data (avoids re-downloading old days)
        uses: actions/cache@v4
        with:
          path: data
          key: nse-data-${{ github.run_id }}
          restore-keys: nse-data-

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run updater
        run: python breadth_update.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "nse-breadth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/metrics.json data/no_data_days.txt data/nifty50_members.csv
          git diff --cached --quiet || git commit -m "Daily breadth update $(date -u +%F)"
          git push
