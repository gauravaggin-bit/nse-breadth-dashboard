name: Update NSE breadth dashboard

on:
  schedule:
    # GitHub only runs scheduled workflows on a "best effort" basis, and its queue
    # can delay a single cron entry by several hours on a free/public-repo schedule.
    # To still land close to 20:00 IST most days, we fire several times through the
    # evening instead of once; the script is safe to run repeatedly (it only commits
    # when there's actually a new day's data, so extra runs are harmless no-ops).
    - cron: "15 13 * * 1-5"   # 18:45 IST
    - cron: "45 13 * * 1-5"   # 19:15 IST
    - cron: "15 14 * * 1-5"   # 19:45 IST
    - cron: "45 14 * * 1-5"   # 20:15 IST
    - cron: "30 15 * * 1-5"   # 21:00 IST
    - cron: "30 16 * * 1-5"   # 22:00 IST  (final catch-up pass)
  workflow_dispatch: {}   # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached NSE data (avoids re-downloading old days)
        uses: actions/cache@v4
        with:
          path: data
          key: nse-data-${{ github.run_id }}
          restore-keys: nse-data-

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run updater
        run: python breadth_update.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "nse-breadth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/metrics.json data/no_data_days.txt data/nifty50_members.csv
          git diff --cached --quiet || git commit -m "Daily breadth update $(date -u +%F)"
          git push
