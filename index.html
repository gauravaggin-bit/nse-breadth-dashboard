<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE market breadth</title>
<style>
  :root{
    --paper:#F6F5F0; --ink:#1B2430; --muted:#66707C; --rule:#D9D6CC;
    --up:#1E7A4C; --down:#B7402E; --index:#2B4E9C; --soft:#ECEAE2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.45 "Segoe UI",Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums}
  body{padding:28px clamp(16px,4vw,56px) 48px;max-width:1280px;margin:0 auto}
  h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0}
  h2{font-size:16px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--muted);margin:4px 0 0}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;
    padding-bottom:16px;border-bottom:2px solid var(--ink)}
  .idx{text-align:right}
  .idx b{font-size:26px;font-weight:600}
  .chg{font-size:15px;margin-left:8px}
  .pos{color:var(--up)} .neg{color:var(--down)}

  /* today's tape */
  .tape{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    border-bottom:1px solid var(--rule);margin-bottom:28px}
  .tape div{padding:14px 12px 12px 0}
  .tape .v{font-size:24px;font-weight:600;line-height:1.1}
  .tape .l{color:var(--muted);font-size:13px;margin-top:4px}
  .tape .v small{font-size:14px;font-weight:400;color:var(--muted)}

  .toolbar{display:flex;gap:6px;justify-content:flex-end;margin:-8px 0 8px}
  .toolbar button{border:1px solid var(--rule);background:transparent;color:var(--muted);
    padding:4px 12px;border-radius:14px;font:inherit;font-size:13px;cursor:pointer}
  .toolbar button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .toolbar button:focus-visible{outline:2px solid var(--index);outline-offset:2px}

  section.chart{margin:0 0 34px}
  section.chart .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  .legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .grid line{stroke:var(--rule);stroke-width:1}
  .axis text{fill:var(--muted);font-size:11px}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;
    padding:8px 10px;border-radius:4px;white-space:pre;display:none;z-index:9;line-height:1.5}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}

  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{font-weight:500;color:var(--muted)}
  details{margin-top:8px;font-size:14px}
  summary{cursor:pointer;color:var(--index)}
  .syms{columns:4 140px;column-gap:16px;margin:8px 0 0;padding:0;list-style:none;color:var(--ink)}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);color:var(--muted);font-size:13px}
  footer a{color:var(--index)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){.toolbar button{transition:background .15s}}
</style>
</head>

(function(){
if(!DATA) return;
const S=DATA.series, T=DATA.summary, L=DATA.lists;
const N=S.dates.length;
const fmt=(v,d=0)=>v==null?'–':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:d});
const last=k=>S[k][N-1], prev=k=>S[k][N-2];
const clsChg=v=>v>0?'pos':v<0?'neg':'';
const monthName=new Date(T.as_of).toLocaleString('en-IN',{month:'long'});

/* ---------- state ---------- */
let range=Math.min(N,130);            // ~6 months default
const RANGES=[['3M',65],['6M',130],['1Y',250],['All',N]];

/* ---------- layout ---------- */
const app=document.getElementById('app');
app.innerHTML=`
<header>
  <div>
    <h1>NSE market breadth</h1>
    <p class="sub">All main-board stocks (EQ series), ${fmt(last('universe_size'))} names · close of ${T.as_of}</p>
  </div>
  <div class="idx">
    <div class="sub">${T.index_name}</div>

    <div class="sub">${S.index_new_ath[N-1]?'New high today':S.index_new_52w_high[N-1]?'New 52-week high today':'52-wk high '+fmt(T.index_52w_high,0)}</div>

  <div><div class="v">${fmt(last('pct_above_20'),0)}%</div><div class="l">Above 20 DMA</div></div>
  <div><div class="v">${fmt(last('pct_above_50'),0)}%</div><div class="l">Above 50 DMA</div></div>

<section class="chart"><div class="head"><h2>Advance–decline line against ${T.index_name}</h2>

</div>

<section class="chart"><div class="head"><h2>Stocks trading above their moving average</h2>
  <div class="legend"><span><i style="background:#8FA3C8"></i>20 DMA</span><span><i style="background:var(--index)"></i>50 DMA</span><span><i style="background:var(--ink)"></i>200 DMA</span></div></div>

<div class="two">

/* ---------- range buttons ---------- */
const rb=document.getElementById('ranges');
RANGES.forEach(([lbl,n])=>{const b=document.createElement('button');b.textContent=lbl;
  b.setAttribute('aria-pressed',n===range);b.onclick=()=>{range=n;draw();};rb.appendChild(b);});

/* ---------- chart engine ---------- */
const tip=document.getElementById('tip');
function slice(k){return S[k].slice(N-range);}
function dates(){return S.dates.slice(N-range);}
function xTicks(ds){const out=[];let m=null;ds.forEach((d,i)=>{const mm=d.slice(0,7);if(mm!==m){m=mm;out.push([i,new Date(d).toLocaleString('en-IN',{month:'short',year:ds.length>260?'2-digit':undefined})]);}});
  return out.length>14?out.filter((_,i)=>i%2===0):out;}
function nice(lo,hi){const span=hi-lo||1,step=Math.pow(10,Math.floor(Math.log10(span/4)));
  const s=[1,2,2.5,5,10].map(x=>x*step).find(x=>span/x<=6)||step*10;
  return [Math.floor(lo/s)*s,Math.ceil(hi/s)*s,s];}

function chart(el,cfg){
  const W=el.clientWidth||900,H=cfg.height||260,P={l:56,r:cfg.right?64:16,t:12,b:28};
  const ds=dates(),n=ds.length,iw=W-P.l-P.r,ih=H-P.t-P.b;
  const X=i=>P.l+(n===1?0:i/(n-1)*iw);
  const scale=(vals,fixed)=>{const v=vals.flat().filter(x=>x!=null);
    let [lo,hi,st]=fixed||nice(Math.min(...v),Math.max(...v));if(fixed){st=fixed[2];}
    return {lo,hi,st,y:val=>P.t+ih-(val-lo)/(hi-lo)*ih};};
  const L=scale(cfg.left.map(s=>s.v),cfg.leftScale);
  const R=cfg.right?scale(cfg.right.map(s=>s.v)):null;
  let g='';
  for(let t=L.lo;t<=L.hi+1e-9;t+=L.st){const y=L.y(t);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/><text class="lab" x="${P.l-8}" y="${y+4}" text-anchor="end">${fmt(t,cfg.dec||0)}${cfg.suffix||''}</text>`;}
  if(R)for(let t=R.lo;t<=R.hi+1e-9;t+=R.st){g+=`<text class="lab" x="${W-P.r+8}" y="${R.y(t)+4}" fill="var(--index)">${fmt(t)}</text>`;}
  let xa='';xTicks(ds).forEach(([i,l])=>{xa+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`;});
  let body='';
  if(cfg.ref!=null&&cfg.ref>=L.lo&&cfg.ref<=L.hi)body+=`<line x1="${P.l}" x2="${W-P.r}" y1="${L.y(cfg.ref)}" y2="${L.y(cfg.ref)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const line=(s,sc)=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+sc.y(v).toFixed(1);pen=true;});
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||1.6}" stroke-linejoin="round"/>`;};
  const bars=(s,sc)=>{const bw=Math.max(1,iw/n*0.7);let o='';s.v.forEach((v,i)=>{if(v==null)return;const base=sc.y(cfg.base||0),y=sc.y(v);
    const c=typeof s.color==='function'?s.color(v,i):s.color;o+=`<rect x="${X(i)-bw/2}" y="${Math.min(y,base)}" width="${bw}" height="${Math.abs(base-y)||0.5}" fill="${c}"/>`;});return o;};
  cfg.left.forEach(s=>body+=s.type==='bar'?bars(s,L):line(s,L));
  if(R)cfg.right.forEach(s=>body+=line(s,R));
  if(cfg.marks){cfg.marks.forEach((on,i)=>{if(on)body+=`<path d="M${X(i)} ${P.t} l4 5 l-4 5 l-4 -5z" fill="var(--index)"/>`;});}
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><g class="grid">${g}</g><g class="axis">${xa}</g>${body}<line id="cur" y1="${P.t}" y2="${P.t+ih}" stroke="var(--ink)" stroke-width="1" opacity="0"/></svg>`;
  el.querySelectorAll('.lab').forEach(t=>t.setAttribute('class','')); el.querySelector('.grid').setAttribute('class','grid axis');
  const svg=el.firstChild,cur=svg.querySelector('#cur');
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;let i=Math.round((px-P.l)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));
    cur.setAttribute('x1',X(i));cur.setAttribute('x2',X(i));cur.setAttribute('opacity','1');
    const rows=[...cfg.left,...(cfg.right||[])].map(s=>`${s.name}: ${fmt(s.v[i]==null?null:Math.abs(s.v[i]),s.dec??cfg.dec??0)}${s.suffix||cfg.suffix||''}`);
    tip.textContent=ds[i]+'\n'+rows.join('\n');tip.style.display='block';
    tip.style.left=Math.min(e.clientX+14,window.innerWidth-180)+'px';tip.style.top=(e.clientY+14)+'px';};
  svg.onmouseleave=()=>{tip.style.display='none';cur.setAttribute('opacity','0');};
}

function draw(){
  rb.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',RANGES[i][1]===range));
  chart(document.getElementById('c_adline'),{height:300,
    left:[{name:'A/D line',v:slice('ad_line'),color:'var(--ink)',width:2}],
    right:[{name:T.index_name,v:slice('index_close'),color:'var(--index)'}]});
  chart(document.getElementById('c_ratio'),{height:220,dec:2,ref:1,base:1,
    left:[{name:'A/D ratio',type:'bar',v:slice('ad_ratio'),color:v=>v>=1?'var(--up)':'var(--down)'}]});
  chart(document.getElementById('c_hl'),{height:220,ref:0,marks:S.index_new_52w_high.slice(N-range),
    left:[{name:'New highs',type:'bar',v:slice('new_high'),color:'var(--up)'},
          {name:'New lows',type:'bar',v:slice('new_low').map(v=>v==null?null:-v),color:'var(--down)'}]});
  chart(document.getElementById('c_dma'),{height:260,suffix:'%',ref:50,leftScale:[0,100,25],
    left:[{name:'Above 20 DMA',v:slice('pct_above_20'),color:'#8FA3C8'},
          {name:'Above 50 DMA',v:slice('pct_above_50'),color:'var(--index)'},
          {name:'Above 200 DMA',v:slice('pct_above_200'),color:'var(--ink)',width:2}]});
}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,120);});
